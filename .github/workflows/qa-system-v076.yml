name: Hasel 360 System QA v0.7.6
on:
  workflow_dispatch:
  push:
    branches: [qa/system-v076]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore tested 0.7.6 application
        run: |
          python3 scripts/apply_v070_overlay.py
          python3 scripts/apply_v071_delta.py
          python3 scripts/apply_v072_overlay.py
          python3 scripts/apply_v073_overlay.py
          python3 scripts/apply_v074_overlay.py
          python3 scripts/apply_v075_overlay.py
          python3 scripts/apply_v076_overlay.py
          grep -q "versionName '0.7.6'" app/build.gradle
      - name: Run legacy and financial unit tests
        run: node --test tests/*.test.cjs
      - name: Install browser testing tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run synthetic system UI regression
        run: |
          python qa/system_ui.py
      - name: Upload test evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hasel360-v076-qa-results
          path: qa/artifacts/
          if-no-files-found: ignore
          retention-days: 14
