name: Hasel360 Desktop Windows 0.9.0 UTF8 Validated
on:
  workflow_dispatch:
  push:
    branches: [feature/desktop-windows-v090]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: HTML patch dependency
        run: python -m pip install beautifulsoup4==4.14.2
      - name: Restore v0.7.0
        run: python scripts/apply_v070_overlay.py
      - name: Restore v0.7.1
        run: python scripts/apply_v071_delta.py
      - name: Restore v0.7.2
        run: python scripts/apply_v072_overlay.py
      - name: Restore v0.7.3
        run: python scripts/apply_v073_overlay.py
      - name: Restore v0.7.4
        run: python scripts/apply_v074_overlay.py
      - name: Restore v0.7.5
        run: python scripts/apply_v075_overlay.py
      - name: Restore v0.7.6
        run: python scripts/apply_v076_overlay.py
      - name: Restore v0.7.7
        run: python scripts/apply_v077_overlay.py
      - name: Restore Excel audit persistence
        run: python scripts/apply_v077_core_patch.py
      - name: Restore v0.7.7.1
        run: python scripts/apply_v0771_stability.py
      - name: Restore speech fallback tests
        run: python scripts/apply_v0771_voice_tests.py
      - name: Restore v0.7.8
        run: python scripts/apply_v078_overlay.py
      - name: Restore v0.8.0
        run: python scripts/apply_v080_overlay.py
      - name: Restore v0.8.1
        run: python scripts/apply_v081_overlay.py
      - name: Restore verified v0.8.2
        run: python scripts/apply_v082_overlay.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests shared financial calculation engine
        run: node --test tests/*.test.cjs
      - name: Prepare desktop UI from v0.8.2
        run: node desktop/prepare.cjs
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Desktop regression tests
        working-directory: desktop
        run: npm test
      - name: Build Windows installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win
      - name: Hash Windows installer
        shell: pwsh
        run: |
          Get-ChildItem desktop/dist/*Setup.exe | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name | Set-Content -Encoding ascii ($_.FullName + ".sha256")
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Hasel360-Desktop-Windows-v090-Installer
          path: |
            desktop/dist/*Setup.exe
            desktop/dist/*Setup.exe.sha256
          retention-days: 14
          if-no-files-found: error
