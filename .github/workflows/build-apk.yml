name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/cash-control-v071, feature/cash-control-v072, feature/cash-control-v073, feature/cash-control-v074, feature/cash-control-v075, feature/cash-control-v076, feature/excel-center-v077, fix/stability-v0771, feature/cashflow-v078]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified Hasel 360 v0.7.0 source
        run: python3 scripts/apply_v070_overlay.py
      - name: Restore checksum-verified Hasel 360 v0.7.1 changes
        run: python3 scripts/apply_v071_delta.py
      - name: Restore version 0.7.2 source
        run: python3 scripts/apply_v072_overlay.py
      - name: Restore version 0.7.3 source
        run: python3 scripts/apply_v073_overlay.py
      - name: Restore Hasel 360 version 0.7.4 source
        run: python3 scripts/apply_v074_overlay.py
      - name: Restore Hasel 360 version 0.7.5 source
        run: python3 scripts/apply_v075_overlay.py
      - name: Restore Hasel 360 version 0.7.6 source
        run: python3 scripts/apply_v076_overlay.py
      - name: Restore checksum-verified Excel center 0.7.7
        run: python3 scripts/apply_v077_overlay.py
      - name: Restore verified Excel audit persistence
        run: python3 scripts/apply_v077_core_patch.py
      - name: Apply guarded 0.7.7.1 stability patch
        run: python3 scripts/apply_v0771_stability.py
      - name: Extend speech fallback unit tests
        run: python3 scripts/apply_v0771_voice_tests.py
      - name: Restore verified Hasel360 v0.7.8 changes
        run: python3 scripts/apply_v078_overlay.py
      - name: Assert exact beta version
        run: grep -q "versionName '0.7.8'" app/build.gradle
      - name: Test legacy flows, budget matrix and payment controls
        run: node --test tests/*.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test XLSX UI and mobile widths
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
          python - <<'PY'
          from pathlib import Path
          p=Path('qa/excel_ui_v077.py')
          s=p.read_text()
          s=s.replace("root=Path('/mnt/data/hasel-v077-work/source/app/src/main/assets')", "root=Path(__file__).resolve().parents[1]/'app/src/main/assets'")
          s=s.replace("headless=True,executable_path='/usr/bin/chromium',args=['--no-sandbox']", "headless=True,args=['--no-sandbox']")
          p.write_text(s)
          PY
          python qa/excel_ui_v077.py
      - name: Test shared event bus, dashboard and stale matrix UI
        run: python qa/sync_ui_v0771.py
      - name: Test offline help, cashflow, recurring and photo UI
        run: python qa/ui_v078_inline.py
      - name: Verify six compact grid/report requirements
        run: python qa/grids_v078.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Checksum APK
        working-directory: app/build/outputs/apk/debug
        run: sha256sum app-debug.apk > app-debug.apk.sha256
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test OCR and sharing on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: Hasel360-v078-next-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hamyar360-lint-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 14